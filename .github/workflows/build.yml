name: Build APK

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        id: build
        continue-on-error: true
        run: ./gradlew assembleDebug --stacktrace 2>&1 | tee gradle-build.log

      # 失败时把日志写回仓库，方便在不方便查看 Actions 日志的场景下排查
      - name: Dump failure log into repository
        if: steps.build.outcome == 'failure'
        run: |
          echo "=== assembleDebug failed at $(date -u '+%Y-%m-%dT%H:%M:%SZ') ===" > ci-failure.log
          tail -n 600 gradle-build.log >> ci-failure.log
          git config user.name "ci-bot"
          git config user.email "ci-bot@users.noreply.github.com"
          git add -f ci-failure.log
          git commit -m "ci: dump build failure log [skip ci]" || exit 0
          git push origin HEAD:master || exit 0

      - name: Upload APK artifact
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: FuckMarketAds-debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: Fail job when build failed
        if: steps.build.outcome == 'failure'
        run: exit 1
